name: Stage verified container release

on:
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Successful main push Quality gate run ID
        required: true
        type: string
      verified_sha:
        description: Full 40-character Git SHA from that run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: self-hosted-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Stage and verify container candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: self-hosted-production
      url: http://39.96.7.2
    env:
      DEPLOY_HOST: 39.96.7.2
      DEPLOY_USER: deploy
      QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
      VERIFIED_SHA: ${{ inputs.verified_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm artifact belongs to a successful main push
        shell: bash
        run: |
          [[ "${QUALITY_RUN_ID}" =~ ^[0-9]+$ ]] || exit 2
          [[ "${VERIFIED_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          details="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}" \
            --jq '[.name,.event,.head_branch,.head_sha,.conclusion] | join("|")')"
          [[ "${details}" == "Quality gate|push|main|${VERIFIED_SHA}|success" ]] || {
            echo "Quality run does not certify the requested main revision: ${details}" >&2
            exit 3
          }

      - name: Check out deployment metadata from the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verified_sha }}

      - name: Resolve immutable artifact from that quality run
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}/artifacts?per_page=100")"
          artifact="$(jq -c --arg name "aitrainer-${VERIFIED_SHA}" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0] else empty end' \
            <<< "${artifacts}")"
          artifact_id="$(jq -r '.id' <<< "${artifact}")"
          artifact_digest="$(jq -r '.digest' <<< "${artifact}")"
          [[ ${artifact_id} =~ ^[0-9]+$ && ${artifact_digest} =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'expected artifact or its digest is unavailable' >&2; exit 5;
          }
          echo "ARTIFACT_ID=${artifact_id}" >> "${GITHUB_ENV}"
          echo "ARTIFACT_DIGEST=${artifact_digest#sha256:}" >> "${GITHUB_ENV}"

      - name: Configure pinned SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          [[ -n "${DEPLOY_SSH_PRIVATE_KEY}" ]] || exit 4
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/aitrainer_deploy"
          chmod 0600 "${HOME}/.ssh/aitrainer_deploy"
          install -m 0644 deploy/ssh/known_hosts "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/aitrainer_deploy" >/dev/null

      - name: Fetch and stage verified container
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "${HOME}/.ssh/aitrainer_deploy"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          # GitHub returns a short-lived Azure Blob URL. Only that URL crosses SSH stdin.
          headers="$(mktemp)"
          trap 'rm -f -- "${headers}"' EXIT
          status="$(curl --silent --show-error --max-time 20 --dump-header "${headers}" \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip")"
          [[ ${status} == 302 ]] || { echo "artifact URL request returned ${status}" >&2; exit 5; }
          signed_url="$(sed -n 's/^[Ll]ocation: //p' "${headers}" | tr -d '\r' | tail -n 1)"
          [[ ${signed_url} == https://*.blob.core.windows.net/* ]] || exit 5
          scp "${ssh_options[@]}" deploy/scripts/fetch-container-artifact.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:uploads/.fetch-container-artifact.sh"
          hashes="$(printf '%s\n' "${signed_url}" | ssh "${ssh_options[@]}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash uploads/.fetch-container-artifact.sh '${VERIFIED_SHA}' '${ARTIFACT_DIGEST}'")"
          read -r release_sha image_sha <<< "${hashes}"
          [[ ${release_sha} =~ ^[0-9a-f]{64}$ && ${image_sha} =~ ^[0-9a-f]{64}$ ]] || exit 5
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'rm -f -- uploads/.fetch-container-artifact.sh'
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/deploy-aitrainer-container '${VERIFIED_SHA}' '${release_sha}' '${image_sha}'"

      - name: Verify the unchanged public route remains ready
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "http://${DEPLOY_HOST}/api/health/ready"

      - name: Remove ephemeral SSH identity
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/aitrainer_deploy"
