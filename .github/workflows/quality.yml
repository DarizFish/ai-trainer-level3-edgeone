name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      SELF_HOSTED_BUILD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run the full quality gate
        run: npm run test:ci

      - name: Package the tested standalone build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: npm run package:self-hosted

      - name: Create verified release archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/aitrainer-${GITHUB_SHA}.tar.gz"
          tar --create --gzip --file "${archive}" --directory dist/self-hosted .
          sha256sum "${archive}"

      - name: Upload verified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aitrainer-${{ github.sha }}
          path: ${{ runner.temp }}/aitrainer-${{ github.sha }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
