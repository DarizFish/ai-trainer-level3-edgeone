name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      SELF_HOSTED_BUILD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run the full quality gate
        run: npm run test:ci

      # 打包在 PR 上也要跑。它现在会自证迁移脚本的依赖真的在发布物里能解析，而这类问题
      # 只在打包阶段暴露：2026-08-15 连着两次部署失败（node 找不到、postgres 找不到）都是
      # 合并之后才发现的，因为这一步原先只在 main 上执行。产物只在 main 上传，PR 上跑它
      # 纯粹是为了让门禁覆盖「这个 artifact 在服务器上真的跑得起来」。
      - name: Package the tested standalone build
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: npm run package:self-hosted

      - name: Build and smoke-test the container image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --file deploy/Dockerfile \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --tag "aitrainer:${GITHUB_SHA}" dist/self-hosted
          test "$(docker image inspect "aitrainer:${GITHUB_SHA}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"
          docker run --detach --name aitrainer-quality \
            --publish 127.0.0.1::3000 "aitrainer:${GITHUB_SHA}" >/dev/null
          trap 'docker logs aitrainer-quality; docker rm -f aitrainer-quality >/dev/null' EXIT
          port="$(docker port aitrainer-quality 3000/tcp | cut -d: -f2)"
          [[ "${port}" =~ ^[0-9]+$ ]]
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              "http://127.0.0.1:${port}/api/health/live" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ "${ready}" -eq 1 ]]

      - name: Create verified release archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/aitrainer-${GITHUB_SHA}.tar.gz"
          tar --create --gzip --file "${archive}" --directory dist/self-hosted .
          sha256sum "${archive}"

      - name: Export verified container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/aitrainer-image-${GITHUB_SHA}.tar.gz"
          docker save "aitrainer:${GITHUB_SHA}" | gzip -1 > "${archive}"
          sha256sum "${archive}"

      - name: Upload verified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aitrainer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aitrainer-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/aitrainer-image-${{ github.sha }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
