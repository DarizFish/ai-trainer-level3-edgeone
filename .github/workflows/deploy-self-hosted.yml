name: Deploy self-hosted server

on:
  push:
    branches:
      - codex/self-hosted-server-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 39.96.7.2
  DEPLOY_USER: deploy

jobs:
  build:
    name: Test and build Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run the full quality gate
        run: npm run test:ci

      - name: Package the tested standalone build
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: npm run package:self-hosted

      - name: Create release archive
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/aitrainer-${GITHUB_SHA}.tar.gz"
          tar --create --gzip --file "${archive}" --directory dist/self-hosted .
          sha256sum "${archive}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: aitrainer-${{ github.sha }}
          path: ${{ runner.temp }}/aitrainer-${{ github.sha }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy and verify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: self-hosted-production
      url: http://39.96.7.2
    steps:
      - name: Check out deployment metadata
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: aitrainer-${{ github.sha }}
          path: release

      - name: Configure pinned SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]]; then
            echo "::error::DEPLOY_SSH_PRIVATE_KEY is not configured"
            exit 1
          fi
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/aitrainer_deploy"
          chmod 0600 "${HOME}/.ssh/aitrainer_deploy"
          install -m 0644 deploy/ssh/known_hosts "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/aitrainer_deploy" >/dev/null

      - name: Upload and activate release
        shell: bash
        run: |
          archive="release/aitrainer-${GITHUB_SHA}.tar.gz"
          archive_sha="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          ssh_options=(
            -i "${HOME}/.ssh/aitrainer_deploy"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          remote_temp="uploads/.aitrainer-${GITHUB_SHA}.tar.gz.upload"
          remote_archive="uploads/aitrainer-${GITHUB_SHA}.tar.gz"
          scp "${ssh_options[@]}" "${archive}" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_temp}"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mv -- '${remote_temp}' '${remote_archive}' && sudo /usr/local/sbin/deploy-aitrainer '${GITHUB_SHA}' '${archive_sha}'"

      - name: Verify public readiness
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "http://${DEPLOY_HOST}/api/health/ready"

      - name: Remove ephemeral SSH identity
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/aitrainer_deploy"
