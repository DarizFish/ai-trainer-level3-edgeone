# This file is included from nginx.conf's `http` block through conf.d/*.conf.
# `$uri` excludes the query string, so cache-busting parameters do not bypass
# the mutable-file rules that fixed the previous JupyterLite cache poisoning.
types {
    application/javascript mjs;
}

# nginx 取第一条命中的正则，所以具体规则必须排在宽泛前缀之前（EdgeOne 规则相反，
# 取最后一条，见 STATUS.md 4.3）。
#
# default 必须是「重校验」而不是空字符串。空字符串等于 nginx 什么都不加：静态文件
# 落到 EdgeOne 的启发式缓存，而 `location /` 代理的页面会把 Next.js 自己发的
# `Cache-Control: s-maxage=31536000` 原样透给 CDN——预渲染页面因此会在边缘留最多
# 一年，改了首页也同步不到用户（2026-08-14 实测 ali.aitrainer3.xyz 首页
# `age: 114379`、`eo-cache-status: HIT`）。带内容哈希的路径继续显式声明 immutable，
# 其余一律重校验：Next 对预渲染页面发 ETag，实测重校验返回 304，代价只是一次条件请求。
map $uri $aitrainer_cache_control {
    default "public, max-age=0, must-revalidate";

    # /api/* 必须是 no-store，不能跟着 default 走。这些响应按 Cookie 区分用户，而
    # CDN 只按 URL 建缓存键；一旦标成 public 可共享，别人的进度和收藏就会被发错人。
    ~^/api/ "no-store";

    ~^/lite/static/pyodide/(?:pyodide\.js|pyodide\.asm\.js|pyodide\.mjs|pyodide-lock\.json|pyodide\.asm\.wasm|python_stdlib\.zip)$ "public, max-age=0, must-revalidate";
    ~^/lite/(?:jupyter-lite\.json|jupyter-lite\.ipynb|config-utils\.js|service-worker\.js)$ "public, max-age=0, must-revalidate";
    ~^/lite/lab/(?:jupyter-lite\.json|jupyter-lite\.ipynb|index\.html)$ "public, max-age=0, must-revalidate";

    ~^/_next/static/ "public, max-age=31536000, immutable";
    ~^/content/ "public, max-age=31536000, immutable";
    ~^/lite/static/ "public, max-age=31536000, immutable";
    ~^/lite/build/ "public, max-age=31536000, immutable";
    ~^/labs/models/ "public, max-age=31536000, immutable";
    ~^/labs/runtime/ "public, max-age=31536000, immutable";
}

map $uri $aitrainer_static_coop {
    default "";
    /lite/lab/index.html "same-origin";
}

map $uri $aitrainer_static_coep {
    default "";
    /lite/lab/index.html "require-corp";
    ~^/lite/extensions/ "require-corp";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 8m;
    sendfile on;
    tcp_nopush on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $aitrainer_cache_control always;
    add_header CDN-Cache-Control $aitrainer_cache_control always;
    add_header Eo-Cdn-Cache-Control $aitrainer_cache_control always;
    add_header Cross-Origin-Opener-Policy $aitrainer_static_coop always;
    add_header Cross-Origin-Embedder-Policy $aitrainer_static_coep always;

    access_log /var/log/nginx/aitrainer.access.log;
    error_log /var/log/nginx/aitrainer.error.log warn;

    location ^~ /_next/static/ {
        alias /srv/aitrainer/current/.next/static/;
    }

    location ^~ /lite/ {
        root /srv/aitrainer/current/public;
    }

    location ^~ /labs/ {
        root /srv/aitrainer/current/public;
    }

    location ^~ /materials/ {
        root /srv/aitrainer/current/public;
    }

    location ^~ /content/ {
        root /srv/aitrainer/current/public;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Direct clients must never be able to impersonate an EdgeOne POP.
        proxy_set_header EO-Connecting-IP "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Next.js emits the same platform-neutral security headers. Keep one
        # canonical copy at Nginx so repeated fields cannot be combined into an
        # invalid value by intermediaries.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        # Next 给预渲染页面发 `Cache-Control: s-maxage=31536000`。不隐藏它，上面
        # add_header 加的重校验指令只会与它并列成一个逗号列表，而共享缓存仍然认
        # s-maxage，页面照样在 CDN 边缘留一年。缓存语义在这里由 $aitrainer_cache_control
        # 单点决定：页面重校验、/api/* no-store。
        proxy_hide_header Cache-Control;
    }
}
