# This file is included from nginx.conf's `http` block through conf.d/*.conf.
# `$uri` excludes the query string, so cache-busting parameters do not bypass
# the mutable-file rules that fixed the previous JupyterLite cache poisoning.
types {
    application/javascript mjs;
}

# 把 realip 还原后的地址和原始 TCP 对端一起记下来：出问题时要能区分「节点不在可信集合
# 里」和「EdgeOne 没发这个头」。$realip_remote_addr 始终是对端；两者相同就说明没还原。
log_format aitrainer_main '$remote_addr via=$realip_remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# nginx 取第一条命中的正则，所以具体规则必须排在宽泛前缀之前（EdgeOne 规则相反，
# 取最后一条，见 docs/INCIDENTS.md 4.3）。
#
# default 必须是「重校验」而不是空字符串。空字符串等于 nginx 什么都不加：静态文件
# 落到 EdgeOne 的启发式缓存，而 `location /` 代理的页面会把 Next.js 自己发的
# `Cache-Control: s-maxage=31536000` 原样透给 CDN——预渲染页面因此会在边缘留最多
# 一年，改了首页也同步不到用户（2026-08-14 实测 ali.aitrainer3.xyz 首页
# `age: 114379`、`eo-cache-status: HIT`）。带内容哈希的路径继续显式声明 immutable，
# 其余一律重校验：Next 对预渲染页面发 ETag，实测重校验返回 304，代价只是一次条件请求。
map $uri $aitrainer_cache_control {
    default "public, max-age=0, must-revalidate";

    # /api/* 必须是 no-store，不能跟着 default 走。这些响应按 Cookie 区分用户，而
    # CDN 只按 URL 建缓存键；一旦标成 public 可共享，别人的进度和收藏就会被发错人。
    ~^/api/ "no-store";

    ~^/lite/static/pyodide/(?:pyodide\.js|pyodide\.asm\.js|pyodide\.mjs|pyodide-lock\.json|pyodide\.asm\.wasm|python_stdlib\.zip)$ "public, max-age=0, must-revalidate";
    ~^/lite/(?:jupyter-lite\.json|jupyter-lite\.ipynb|config-utils\.js|service-worker\.js)$ "public, max-age=0, must-revalidate";
    ~^/lite/lab/(?:jupyter-lite\.json|jupyter-lite\.ipynb|index\.html)$ "public, max-age=0, must-revalidate";

    ~^/_next/static/ "public, max-age=31536000, immutable";
    ~^/content/ "public, max-age=31536000, immutable";
    ~^/lite/static/ "public, max-age=31536000, immutable";
    ~^/lite/build/ "public, max-age=31536000, immutable";
    ~^/labs/models/ "public, max-age=31536000, immutable";
    ~^/labs/runtime/ "public, max-age=31536000, immutable";
}

# 这里曾有 $aitrainer_static_coop / $aitrainer_static_coep 两个 map，给
# /lite/lab/index.html 发 COOP: same-origin + COEP: require-corp，给 /lite/extensions/
# 发 COEP。它们是 b175204 加的：当时 service-worker-manager 扩展被禁用，
# `mountDrive = serviceWorkerManager?.enabled || crossOriginIsolated` 只剩跨源隔离一条路。
#
# 这份配置（1aee62c，2026-08-02）照抄了当时的 edgeone.json。11 天后 ff54ebd 把这两个头
# 从 edgeone.json 和 next.config.ts 删掉了——74bac6c 恢复 Service Worker 之后 /drive 挂载
# 不再依赖跨源隔离，而跨源隔离会把 Pyodide Kernel 0.6.1 切回 SharedArrayBuffer/Atomics
# 的同步 worker，正是那次要移除的永久等待路径。当时没有同步改这里。
#
# 不要加回来。加回来的故障方式特别难查：只要有人给顶层页也发上 COOP/COEP，跨源隔离当场
# 成立、同步死锁复活，而且只在自托管这条链路上复活，EdgeOne 预览环境测不出来。
# 约束本身见 jupyterlite/README.md 的硬约束一节；tests/production-smoke.test.mjs 有一条守住它。

# EdgeOne 作为 CDN 挡在前面之后，$remote_addr 是边缘节点而不是用户。实测：用户真实
# 地址 183.195.11.71 经 CDN 到达时 $remote_addr = 223.109.1.187（节点），而
# EO-Connecting-IP 里才是 183.195.11.71。下面的 X-Real-IP 由 $remote_addr 推导、应用又
# 只信 X-Real-IP，所以不还原就等于把同一节点后面的所有用户当成同一个人：
# lib/auth-throttle.ts 的 login:ip 桶是 20 次/15 分钟、register:ip 是 5 次/小时，
# 全站会被压进这一个桶里，上线当天正常用户就会互相把对方锁死。
#
# 还原用 realip 模块，而不是直接读这个头：它只在对端本身落在 set_real_ip_from 的可信
# 集合里时才改写 $remote_addr。可信集合是唯一的旋钮，收紧/放宽都只改那一个文件，应用
# 代码和这里都不用动。当前免费版拿不到回源网段清单，那个文件取的是全网信任——代价、
# 剩下的兜底、以及两条收紧路径都写在里面了。
include /etc/nginx/aitrainer-edgeone-origin.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    real_ip_header EO-Connecting-IP;
    # 这个头由 EdgeOne 直接写入，不是逐跳累积的列表，不能按 XFF 那样向左回溯。
    real_ip_recursive off;

    server_tokens off;
    client_max_body_size 8m;
    sendfile on;
    tcp_nopush on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $aitrainer_cache_control always;
    add_header CDN-Cache-Control $aitrainer_cache_control always;
    add_header Eo-Cdn-Cache-Control $aitrainer_cache_control always;

    access_log /var/log/nginx/aitrainer.access.log aitrainer_main;
    error_log /var/log/nginx/aitrainer.error.log warn;

    location ^~ /_next/static/ {
        alias /srv/aitrainer/current/.next/static/;
    }

    location ^~ /lite/ {
        root /srv/aitrainer/current/public;
    }

    location ^~ /labs/ {
        root /srv/aitrainer/current/public;
    }

    location ^~ /materials/ {
        root /srv/aitrainer/current/public;
    }

    location ^~ /content/ {
        root /srv/aitrainer/current/public;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # realip 已经把 $remote_addr 还原成用户地址（仅当对端可信），所以这一行现在
        # 传的是真实用户 IP；对端不可信时它仍是对端地址，与修复前一致。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 原始头必须继续清空：应用只能看见 Nginx 判定过的 X-Real-IP。直连的人可以随手
        # 伪造 EO-Connecting-IP（已实测），放它进去等于让应用绕过 realip 的可信判定。
        proxy_set_header EO-Connecting-IP "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Next.js emits the same platform-neutral security headers. Keep one
        # canonical copy at Nginx so repeated fields cannot be combined into an
        # invalid value by intermediaries.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        # Next 给预渲染页面发 `Cache-Control: s-maxage=31536000`。不隐藏它，上面
        # add_header 加的重校验指令只会与它并列成一个逗号列表，而共享缓存仍然认
        # s-maxage，页面照样在 CDN 边缘留一年。缓存语义在这里由 $aitrainer_cache_control
        # 单点决定：页面重校验、/api/* no-store。
        proxy_hide_header Cache-Control;
    }
}
