# realip 的可信对端集合：只有列在这里的对端，Nginx 才会用它送来的 EO-Connecting-IP
# 覆盖 $remote_addr。
#
# 当前是**全网信任**，这是一次有意的降级，不是漏配。
#
# 原因：本站用的是 EdgeOne 免费版，控制台不提供「源站防护 / 回源 IP 网段」，官方
# https://api.edgeone.ai/ips 已于 2026-07 下线（现在恰好返回 0.0.0.0/0）。手里只有
# 2026-08-14 实测到的两个节点（223.109.0.243、223.109.1.187），远不是全部。用这份
# 残缺清单去收紧，结果是绝大多数节点后面的用户仍然共用一个限流桶——正是要修的那个
# 毛病。于是先取「所有用户的 IP 都是准的」，把伪造留给下面的兜底防线。
#
# 放宽之后具体失去了什么（直连源站的人可以自造 IP，源站目前也确实可直连）：
#
#   * register:ip 5 次/小时 —— 失效。灌注册没有别的闸门，这是最大的敞口。
#   * login:ip 20 次/15 分钟 —— 失效。它同时是 PBKDF2 的 CPU 上界，失去后单个来源
#     可以持续引发 10 万轮哈希（登录接口对不存在的账号也走等时路径）。
#
# 还挡得住什么（这些不依赖 IP，所以是现在唯一还站着的一道）：
#
#   * login:email 失败 10 次/15 分钟 —— 换着 IP 打同一个账号仍然打不动。
#     它现在是撞库的唯一闸门，contracts 有一条守住「账号不存在时也要计数」。
#
# 想收紧回去，任选其一，都不需要改应用代码：
#
#   1. 升级 EdgeOne 套餐拿到回源网段清单，把下面两行换成清单内容；
#   2. 或者堵住直连——安全组只放行回源网段 + 管理 IP。做到这一步之后，全网信任本身
#      就不再有代价，因为唯一可能的对端只剩 EdgeOne。
#
# 伪造挡不住，但看得见：日志格式是 `$remote_addr via=$realip_remote_addr`，via= 始终是
# 真实 TCP 对端，realip 改不掉它。经 CDN 的请求 via= 是 EdgeOne 节点，直连的不是，所以
# 下面这条能把绕过 CDN 的来源直接列出来（实测伪造请求记成 `9.9.9.9 via=183.195.11.71`），
# 需要时按 via= 封禁即可：
#     awk '$2 ~ /^via=/ {print substr($2,5)}' /var/log/nginx/aitrainer.access.log | sort | uniq -c | sort -rn
#
# 收紧之后这条命令换个用法——列出「没能还原」的请求，其 via= 即候选的漏列节点地址：
#     awk '$2 ~ /^via=/ && $1 == substr($2,5)' /var/log/nginx/aitrainer.access.log
#
# 2026-08-14 实测确认的回源节点，收紧时可直接用作起点：
#     set_real_ip_from 223.109.0.243;
#     set_real_ip_from 223.109.1.187;

set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
