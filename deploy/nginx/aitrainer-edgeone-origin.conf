# EdgeOne 回源节点网段 —— realip 的可信对端集合。
#
# 只有列在这里的对端，Nginx 才会用它送来的 EO-Connecting-IP 覆盖 $remote_addr。
# 没列上的对端一律按 TCP 对端地址算，所以：
#
#   * 漏列一个节点 = 该节点后面的用户共用一个限流桶（等于修复前的行为，不是安全漏洞）
#   * 多列一个不属于 EdgeOne 的地址 = 那个地址可以随意伪造用户 IP、彻底绕开限流
#
# 两个方向的代价不对称，所以宁可漏、不可多。绝对不要写 0.0.0.0/0：
# 已下线的 https://api.edgeone.ai/ips 现在正好返回这一行（2026-08-14 实测），
# 照抄等于关掉整个判定。
#
# 权威来源是 EdgeOne 控制台的「源站防护 / 回源 IP 网段」，或 Tencent Cloud API
# DescribeOriginProtection。它会随节点扩容变化，属于需要定期同步的数据。
#
# 同步后如何自查：Nginx 日志格式是 `$remote_addr via=$realip_remote_addr`，
# 两者不同说明还原成功；若线上用户的 via= 出现了本文件里没有的地址，就是漏列。
#     awk '$2 ~ /^via=/ && $1 == substr($2,5)' /var/log/nginx/aitrainer.access.log
# 列出的就是「没能还原」的请求，其 via= 值即候选节点地址。

# 2026-08-14 实测确认的回源节点（穿过 CDN 的请求携带 EO-Connecting-IP，对端为下列地址）
set_real_ip_from 223.109.0.243;
set_real_ip_from 223.109.1.187;
